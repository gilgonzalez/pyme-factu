name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Credenciales desechables, solo para este contenedor efímero de CI.
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin_password_only_for_ci
          POSTGRES_DB: facturalibre
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin -d facturalibre"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # SMTP de pruebas: los correos de verificación, recuperación e invitación se leen por su API en E2E.
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_DATABASE_URL: postgresql://ci_admin:ci_admin_password_only_for_ci@localhost:5432/postgres
      DATABASE_URL: postgresql://ci_admin:ci_admin_password_only_for_ci@localhost:5432/facturalibre
      APP_DB_PASSWORD: ci_app_password_only_for_ci
      AUTH_DB_PASSWORD: ci_auth_password_only_for_ci
      WORKER_DB_PASSWORD: ci_worker_password_only_for_ci
      APP_DATABASE_URL: postgresql://facturalibre_app:ci_app_password_only_for_ci@localhost:5432/facturalibre
      AUTH_DATABASE_URL: postgresql://facturalibre_auth:ci_auth_password_only_for_ci@localhost:5432/facturalibre
      AUTH_SECRET: ci_auth_secret_only_for_ci_0123456789abcdef
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: "FacturaLibre CI <no-responder@ci.invalid>"
      # Debe coincidir con la baseURL de Playwright: los enlaces de los correos y las cookies dependen de ella.
      APP_BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm dry
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm --filter @facturalibre/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_EXPECT_DATABASE: "1"
          E2E_FULL_STACK: "1"
          # Los recorridos registran varias cuentas desde la misma IP: sin rate limiting en E2E
          # (el rate limiting se prueba en packages/auth).
          FACTURALIBRE_ENV: development
