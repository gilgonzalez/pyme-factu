name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Contenedor efímero, solo accesible desde el runner: sin contraseña de administrador en el repositorio.
          POSTGRES_USER: ci_admin
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: facturalibre
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin -d facturalibre"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # SMTP de pruebas: los correos de verificación, recuperación e invitación se leen por su API en E2E.
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_DATABASE_URL: postgresql://ci_admin@localhost:5432/postgres
      DATABASE_URL: postgresql://ci_admin@localhost:5432/facturalibre
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: "FacturaLibre CI <no-responder@ci.invalid>"
      # Debe coincidir con la baseURL de Playwright: los enlaces de los correos y las cookies dependen de ella.
      APP_BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      # Secretos de CI generados en cada ejecución (nunca en el repositorio) y enmascarados en los logs.
      - name: Secretos efímeros
        run: |
          app=$(openssl rand -hex 24)
          auth=$(openssl rand -hex 24)
          worker=$(openssl rand -hex 24)
          auth_secret=$(openssl rand -hex 32)
          kek=$(openssl rand -base64 32)
          for value in "$app" "$auth" "$worker" "$auth_secret" "$kek"; do echo "::add-mask::$value"; done
          {
            echo "APP_DB_PASSWORD=$app"
            echo "AUTH_DB_PASSWORD=$auth"
            echo "WORKER_DB_PASSWORD=$worker"
            echo "APP_DATABASE_URL=postgresql://facturalibre_app:$app@localhost:5432/facturalibre"
            echo "AUTH_DATABASE_URL=postgresql://facturalibre_auth:$auth@localhost:5432/facturalibre"
            echo "AUTH_SECRET=$auth_secret"
            echo "CERTIFICATE_KEK=$kek"
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm dry
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm --filter @facturalibre/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_EXPECT_DATABASE: "1"
          E2E_FULL_STACK: "1"
          # Los recorridos registran varias cuentas desde la misma IP: sin rate limiting en E2E
          # (el rate limiting se prueba en packages/auth).
          FACTURALIBRE_ENV: development
